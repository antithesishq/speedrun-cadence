name: cadence-antithesis
services:
  postgres:
    container_name: postgres
    hostname: postgres
    platform: linux/amd64
    image: postgres:17.4
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence
    command: ["postgres", "-c", "max_connections=400", "-c", "idle_in_transaction_session_timeout=30s", "-c", "tcp_keepalives_idle=10", "-c", "tcp_keepalives_interval=5", "-c", "tcp_keepalives_count=3"]
    networks:
      net:
        ipv4_address: 10.20.20.5
  schema:
    container_name: schema
    hostname: schema
    platform: linux/amd64
    image: cadence-server:fixverify
    entrypoint: ["/usr/local/bin/setup-schema.sh"]
    depends_on: [postgres]
    networks:
      net:
        ipv4_address: 10.20.20.6

  cadence1:
    container_name: cadence1
    hostname: cadence1
    platform: linux/amd64
    image: cadence-server:fixverify
    environment:
      SERVICES: frontend,history,matching,worker
    volumes:
      - ./cadence.yaml:/config/cadence.yaml:ro
      - ./dynamicconfig.yaml:/config/dynamicconfig.yaml:ro
    depends_on:
      schema:
        condition: service_completed_successfully
    networks:
      net:
        ipv4_address: 10.20.20.11

  cadence2:
    container_name: cadence2
    hostname: cadence2
    platform: linux/amd64
    image: cadence-server:fixverify
    environment:
      SERVICES: frontend,history,matching,worker
    volumes:
      - ./cadence.yaml:/config/cadence.yaml:ro
      - ./dynamicconfig.yaml:/config/dynamicconfig.yaml:ro
    depends_on:
      schema:
        condition: service_completed_successfully
    networks:
      net:
        ipv4_address: 10.20.20.12

  cadence3:
    container_name: cadence3
    hostname: cadence3
    platform: linux/amd64
    image: cadence-server:fixverify
    environment:
      SERVICES: frontend,history,matching,worker
    volumes:
      - ./cadence.yaml:/config/cadence.yaml:ro
      - ./dynamicconfig.yaml:/config/dynamicconfig.yaml:ro
    depends_on:
      schema:
        condition: service_completed_successfully
    networks:
      net:
        ipv4_address: 10.20.20.13

  client1:
    container_name: client1
    hostname: client1
    platform: linux/amd64
    image: cadence-client:latest
    environment:
      CADENCE_FRONTENDS: 10.20.20.11:7833,10.20.20.12:7833,10.20.20.13:7833
    volumes:
      - clients:/clients
    networks:
      net:
        ipv4_address: 10.20.20.21

  client2:
    container_name: client2
    hostname: client2
    platform: linux/amd64
    image: cadence-client:latest
    environment:
      CADENCE_FRONTENDS: 10.20.20.11:7833,10.20.20.12:7833,10.20.20.13:7833
    volumes:
      - clients:/clients
    networks:
      net:
        ipv4_address: 10.20.20.22

  client3:
    container_name: client3
    hostname: client3
    platform: linux/amd64
    image: cadence-client:latest
    environment:
      CADENCE_FRONTENDS: 10.20.20.11:7833,10.20.20.12:7833,10.20.20.13:7833
    volumes:
      - clients:/clients
    networks:
      net:
        ipv4_address: 10.20.20.23

  driver:
    container_name: driver
    hostname: driver
    platform: linux/amd64
    image: cadence-driver:latest
    environment:
      CLIENTS: client1,client2,client3
    volumes:
      - clients:/clients
    networks:
      net:
        ipv4_address: 10.20.20.30
volumes:
  clients:
networks:
  net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.20.0/24
